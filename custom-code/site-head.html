<script>
/* Block Meta's automatic AddToCart/InitiateCheckout duplicates (they have no price).
   Webflow's proper events, which include the price, still go through. */
(function(){
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (!d || !d.set) return;
  Object.defineProperty(HTMLImageElement.prototype, 'src', {
    configurable: true,
    get: function(){ return d.get.call(this); },
    set: function(v){
      try {
        var s = String(v);
        if (s.indexOf('facebook.com/tr') > -1 &&
            /[?&]ev=(AddToCart|InitiateCheckout)(&|$)/.test(s) &&
            !/cd(%5B|\[)value(%5D|\])=/.test(s)) return;
      } catch (e) {}
      d.set.call(this, v);
    }
  });
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  try {
    const myButton = document.getElementById('daburger');
    const myDiv = document.querySelector('.page-wrapper');
    const html = document.documentElement;
    let isMenuOpen = false;
    
    if (!myButton) {
      throw new Error("Element with id 'daburger' not found");
    }
    if (!myDiv) {
      throw new Error("Element with class 'page-wrapper' not found");
    }

    // Store the scroll position when menu opens
    let scrollPosition = 0;

    // Handle menu toggle
    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      
      if (isMenuOpen) {
        // Store current scroll position before locking
        scrollPosition = window.pageYOffset;
        // Add menu open class
        myDiv.classList.add('is-open');
        // Lock the body
        html.style.position = 'fixed';
        html.style.top = `-${scrollPosition}px`;
        html.style.width = '100%';
      } else {
        // Remove menu open class
        myDiv.classList.remove('is-open');
        // Unlock the body and restore scroll position
        html.style.position = '';
        html.style.top = '';
        html.style.width = '';
        window.scrollTo(0, scrollPosition);
      }
    }

    // Handle all menu links
    document.addEventListener('click', function(e) {
      const anchor = e.target.closest('a');
      if (!anchor || !isMenuOpen) return;

      const href = anchor.getAttribute('href');
      
      // For pure anchor links, just remove the class and let Webflow handle the navigation
      if (href.startsWith('#')) {
        myDiv.classList.remove('is-open');
        html.style.position = '';
        html.style.top = '';
        html.style.width = '';
        window.scrollTo(0, scrollPosition);
        isMenuOpen = false;
        return;
      }
      
      const currentPath = window.location.pathname;
      
      // Check if this is a relative link with anchor within the current page
      if (
        (href.includes('#') && href.split('#')[0] === currentPath) || // Current path + anchor
        (currentPath.endsWith(href.split('#')[0])) // Relative path + anchor matching current page
      ) {
        e.preventDefault();
        const targetId = href.split('#')[1];
        const targetElement = document.getElementById(targetId);
        
        if (targetElement) {
          // Close menu by triggering click on burger menu
          myButton.click();
          
          // Wait for menu close animation to complete
          setTimeout(() => {
            targetElement.scrollIntoView({
              behavior: 'smooth'
            });
          }, 300); // Adjust timeout to match your menu close animation duration
        }
      }
    });

    // Add click event listener to burger menu
    myButton.addEventListener('click', toggleMenu);
    
    console.log("Event listeners added successfully");
  } catch (error) {
    console.error("An error occurred:", error.message);
  }
});
</script>
